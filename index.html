const monthTitle = document.getElementById('cal-month-title');
  const grid = document.getElementById('cal-grid');
  const agendaTitle = document.getElementById('cal-agenda-title');
  const agendaList = document.getElementById('cal-agenda-list');
  const bell = document.getElementById('cal-bell');
  const notifications = document.getElementById('cal-notifications');
  const notificationList = document.getElementById('cal-notification-list');

  if (!monthTitle || !grid || !agendaTitle || !agendaList) return;

    function dateKey(year, month, day) {
    return year + '-' +
      String(month + 1).padStart(2, '0') + '-' +
      String(day).padStart(2, '0');
  }

  function renderAgenda() {
  const parts = selectedDate.split('-').map(Number);
  const date = new Date(parts[0], parts[1] - 1, parts[2]);

  agendaTitle.textContent = date.toLocaleDateString('en-GB', {
    month: 'long',
    day: 'numeric'
  });

  const event = events[selectedDate];

  if (!event || !event.title) {
    agendaList.innerHTML =
      '<div class="cal-empty">No events scheduled.</div>';
    return;
  }

  const details = (event.detail || '')
    .split('<br>')
    .map(item => item.trim())
    .filter(Boolean);

  agendaList.innerHTML =
    `<div class="cal-event">
  <strong>${event.title}</strong>${details.length ? '<br>' + details[0] : ''}
</div>` +
    details.slice(1).map(item =>
      `<div class="cal-event">${item}</div>`
    ).join('');
  }

  function renderCalendar() {
    const current = months[monthIndex];
    const year = current.year;
    const month = current.month;

    monthTitle.textContent = new Date(year, month, 1)
      .toLocaleDateString('en-US', {
        month: 'long',
        year: 'numeric'
      });

    grid.innerHTML = '';

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      const blank = document.createElement('span');
      grid.appendChild(blank);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const key = dateKey(year, month, day);
      const button = document.createElement('button');

      button.className = 'cal-day';
      button.textContent = day;
      button.type = 'button';

      if (key === selectedDate) {
        button.classList.add('selected');
      }

      if (events[key] && events[key].title) {
  button.classList.add('has-event');
      }

      button.addEventListener('click', () => {
        selectedDate = key;
        renderCalendar();
        renderAgenda();
      });

      grid.appendChild(button);
    }

    renderAgenda();
  }

  document.getElementById('cal-prev').onclick = () => {
    if (monthIndex > 0) {
      monthIndex--;
      const m = months[monthIndex];
      selectedDate = dateKey(m.year, m.month, 1);
      renderCalendar();
    }
  };

  document.getElementById('cal-next').onclick = () => {
    if (monthIndex < months.length - 1) {
      monthIndex++;
      const m = months[monthIndex];
      selectedDate = dateKey(m.year, m.month, 1);
      renderCalendar();
    }
  };

  document.getElementById('cal-today').onclick = () => {
    const m = months[monthIndex];
    selectedDate = dateKey(m.year, m.month, 1);
    renderCalendar();
  };

  if (bell && notifications) {
    bell.onclick = () => {
      notifications.hidden = !notifications.hidden;

      if (!notifications.hidden) {
        const allEvents = Object.entries(events)
  .filter(([date, event]) => event && event.title)
  .map(([date, event]) => ({ date, ...event }))
  .sort((a, b) => a.date.localeCompare(b.date));

        notificationList.innerHTML = allEvents.map(event =>
          `<div class="cal-event">
            ${event.title}
            <small>${event.date}</small>
          </div>`
        ).join('') || '<div class="cal-empty">No notifications.</div>';
      }
    };
  }

  const closeButton = document.getElementById('cal-close-notifications');

  if (closeButton && notifications) {
    closeButton.onclick = () => {
      notifications.hidden = true;
    };
  }

  renderCalendar();
  }
</script>

<script>
(function () {
  const screen = document.getElementById('screen');
  const center = document.getElementById('notification-center');
  const close = document.getElementById('close-notifications');

  if (!screen || !center || !close) return;

  let startY = null;

  screen.addEventListener('touchstart', function (e) {
    startY = e.touches[0].clientY;
  }, { passive: true });

  screen.addEventListener('touchend', function (e) {
    if (startY === null) return;

    const endY = e.changedTouches[0].clientY;
    const distance = Math.abs(endY - startY);

    if (distance > 60) {
      center.style.display = 'none';

      const unlock = document.getElementById('unlock');
      const view = document.getElementById('view');

      if (unlock && view.querySelector('.lock')) {
        unlock.click();
      }
    }

    startY = null;
  }, { passive: true });

  close.addEventListener('click', function () {
    center.style.display = 'none';
  });
})();
</script>
